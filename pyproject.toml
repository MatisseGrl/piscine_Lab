[project]
name = "piscine-lab"
version = "0.1.0"
description = "Mini-GPT from scratch and French pretraining data pipeline (ECE I Lab piscine)"
requires-python = ">=3.12"
dependencies = [
    "fasttext-community>=0.11.9",
    "ftfy>=6.3.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pyarrow>=26.0.1",
    "tokenizers>=0.23.3",
    "torch>=2.15.0",
    "tqdm>=4.70.1",
    "tzdata>=2026.6",
    "warcio>=1.8.2",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.5",
    "pytest>=9.2.0",
    "regex>=2026.9.29",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
